name: restore-index-once
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-index.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index from backup branch
        run: |
          git fetch origin backup/pre-overhaul-2026-10-16
          git show origin/backup/pre-overhaul-2026-10-16:docs/index.html > docs/index.html
          python3 << 'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          t = p.read_text(encoding='utf-8')
          old = 'https://gitverse.ru/api/repos/Akres/VPN/raw/branch/master/all'
          new = 'https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt'
          t = t.replace(old, new).replace('Akres VPN', 'V2Ray Aggregator')
          t = t.replace(
            '<tr><td>Linux</td><td><a href="https://github.com/hiddify/hiddify-next/releases" target="_blank" rel="noopener">Hiddify</a></td><td><a href="https://github.com/MatsuriDayo/nekoray/releases" target="_blank" rel="noopener">NekoRay</a></td></tr>',
            '<tr><td>Linux</td><td><a href="https://github.com/hiddify/hiddify-next/releases" target="_blank" rel="noopener">Hiddify</a></td><td><a href="https://github.com/clash-verge-rev/clash-verge-rev/releases" target="_blank" rel="noopener">Clash Verge</a></td></tr>'
          )
          t = t.replace(
            '<tr><td>Android TV</td><td><a href="https://github.com/MatsuriDayo/NekoBoxForAndroid/releases" target="_blank" rel="noopener">NekoBox</a></td><td><a href="https://github.com/hiddify/hiddify-next/releases" target="_blank" rel="noopener">Hiddify</a></td></tr>',
            '<tr><td>Android TV</td><td><a href="https://github.com/hiddify/hiddify-next/releases" target="_blank" rel="noopener">Hiddify</a></td><td><a href="https://github.com/2dust/v2rayNG/releases" target="_blank" rel="noopener">v2rayNG</a></td></tr>'
          )
          p.write_text(t, encoding='utf-8')
          print('patched', len(t))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet && echo 'no changes' && exit 0
          git commit -m 'restore: original docs/index.html from backup (light link fixes)'
          git push
