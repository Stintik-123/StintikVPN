name: Синхронизация README

on:
  push:
    branches: [main]
    paths:
      - "docs/data.json"
      - "scripts/sync_readme.py"
      - "README.md"
      - "README_EN.md"
      - "README_CN.md"
      - "README_IR.md"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-readme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Синхронизировать README с docs/data.json
        run: python3 scripts/sync_readme.py

      - name: Закоммитить изменения
        run: |
          if git diff --quiet; then
            echo "README уже синхронизирован с docs/data.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_EN.md README_CN.md README_IR.md
          git commit -m "docs: синхронизирую разделы со ссылками с docs/data.json"
          git push
