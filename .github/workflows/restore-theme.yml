name: Restore black-orange theme
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-theme.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore docs from good commit
        run: |
          git checkout 5d9ea91579ea52e1d87f257773b020532f530806 -- docs/style.css docs/index.html docs/script.js docs/data.json
          git config user.name "Stintik-123"
          git config user.email "stintikvpn@proton.me"
          git add docs/
          if git diff --staged --quiet; then
            echo "Nothing to restore"
          else
            git commit -m "restore: full black-orange theme from 5d9ea91 (via CI)"
            git push
          fi
