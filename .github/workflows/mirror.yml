name: Зеркала

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Рассылка по зеркалам
        env:
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          CODEBERG_URL: ${{ secrets.CODEBERG_URL }}
          GITVERSE_URL: ${{ secrets.GITVERSE_URL }}
        run: |
          FAILED=""

          push_mirror () {
            name="$1"
            url="$2"
            if [ -z "$url" ]; then
              echo "Пропускаю $name — адрес не задан"
              return 0
            fi
            echo ">>> Отправляю в $name"
            git remote remove "$name" 2>/dev/null || true
            git remote add "$name" "$url"
            # сначала узнаём состояние зеркала, иначе --force-with-lease ругается "stale info"
            if git fetch --quiet --tags "$name"; then
              git push --force-with-lease --tags "$name" HEAD:main
            else
              echo "Не удалось получить состояние $name — отправляю без lease"
              git push --force --tags "$name" HEAD:main
            fi
            echo "OK $name"
          }

          for pair in "gitlab:$GITLAB_URL" "codeberg:$CODEBERG_URL" "gitverse:$GITVERSE_URL"; do
            name="${pair%%:*}"
            url="${pair#*:}"
            push_mirror "$name" "$url" || FAILED="$FAILED $name"
          done

          if [ -n "$FAILED" ]; then
            echo "Не удалось отправить в:$FAILED"
            exit 1
          fi

      - name: Актуализировать описания зеркал
        env:
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          CODEBERG_URL: ${{ secrets.CODEBERG_URL }}
          GITVERSE_URL: ${{ secrets.GITVERSE_URL }}
        run: |
          DESCRIPTION="Бесплатные VPN-подписки, Telegram-прокси и инструкции по обходу блокировок. Конфиги обновляются автоматически, ссылки проверяет CI."
          WEBSITE="https://stintik-123.github.io/StintikVPN/"
          TOPICS="vpn,free-vpn,vpn-configs,v2ray,xray,vmess,vless,trojan,shadowsocks,wireguard,mtproto,telegram,tor,dpi,bypass,censorship,russia"

          token_of () { printf '%s' "$1" | sed -E 's#^[a-zA-Z]+://[^:/]*:([^@]*)@.*#\1#'; }
          host_of ()  { printf '%s' "$1" | sed -E 's#^[a-zA-Z]+://##; s#^[^@]*@##; s#[:/].*$##'; }
          repo_of ()  { printf '%s' "$1" | sed -E 's#.*[:/]([^/]+)/([^/]+?)(\.git)?/?$#\1/\2#' | sed 's#\.git$##'; }

          # --- GitLab (свой API) ---
          gl_token="$(token_of "$GITLAB_URL")"
          if [ -n "$gl_token" ]; then
            gl_project="$(repo_of "$GITLAB_URL")"
            gl_code=$(curl -s -o /tmp/gl.out -w "%{http_code}" --request PUT \
              --header "PRIVATE-TOKEN: $gl_token" \
              --data-urlencode "description=$DESCRIPTION" \
              --data-urlencode "topics=$TOPICS" \
              --data-urlencode "issues_access_level=enabled" \
              "https://gitlab.com/api/v4/projects/$(printf '%s' "$gl_project" | sed 's#/#%2F#')")
            if [ "$gl_code" = "200" ]; then
              echo "GitLab: описание и темы обновлены"
            else
              echo "GitLab: не удалось обновить описание (HTTP $gl_code)"
              echo "GitLab: проект $gl_project, ответ: $(head -c 300 /tmp/gl.out)"
            fi
          fi

          # --- Codeberg и GitVerse (Gitea-совместимый API) ---
          update_gitea_like () {
            label="$1"
            url="$2"
            token="$(token_of "$url")"
            if [ -z "$token" ]; then
              echo "$label: токен не найден — пропускаю"
              return 0
            fi
            project="$(repo_of "$url")"
            body="$(jq -n --arg d "$DESCRIPTION" --arg w "$WEBSITE" --arg t "$TOPICS" \
                    '{description:$d, website:$w, topics:($t|split(","))}')"
            shift
            for base in "$@"; do
              code=$(curl -s -o /tmp/out -w "%{http_code}" --request PATCH \
                --header "Authorization: token $token" \
                --header "Content-Type: application/json" \
                --data "$body" "$base/repos/$project")
              if [ "$code" = "200" ]; then
                echo "$label: описание и темы обновлены ($base)"
                return 0
              fi
              echo "$label: $base — HTTP $code"
            done
            echo "$label: описание не обновлено, ответ: $(head -c 200 /tmp/out)"
          }

          update_gitea_like "Codeberg" "$CODEBERG_URL" "https://codeberg.org/api/v1"
          update_gitea_like "GitVerse" "$GITVERSE_URL" "https://api.gitverse.ru/api/v1" "https://gitverse.ru/api/v1"

      - name: Убрать с зеркал лишние ветки
        env:
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          CODEBERG_URL: ${{ secrets.CODEBERG_URL }}
          GITVERSE_URL: ${{ secrets.GITVERSE_URL }}
        run: |
          token_of () { printf '%s' "$1" | sed -E 's#^[a-zA-Z]+://[^:/]*:([^@]*)@.*#\1#'; }
          host_of ()  { printf '%s' "$1" | sed -E 's#^[a-zA-Z]+://##; s#^[^@]*@##; s#[:/].*$##'; }
          repo_of ()  { printf '%s' "$1" | sed -E 's#.*[:/]([^/]+)/([^/]+?)(\.git)?/?$#\1/\2#' | sed 's#\.git$##'; }
          enc () { jq -sRr @uri; }

          # GitLab
          gl_token="$(token_of "$GITLAB_URL")"
          if [ -n "$gl_token" ]; then
            gl_project="$(repo_of "$GITLAB_URL")"
            gl_id="$(printf '%s' "$gl_project" | sed 's#/#%2F#')"
            for b in $(curl -s --header "PRIVATE-TOKEN: $gl_token" \
                "https://gitlab.com/api/v4/projects/$gl_id/repository/branches" | jq -r '.[].name' | grep -v '^main$'); do
              enc_name="$(printf '%s' "$b" | enc)"
              curl -s -o /dev/null --request DELETE --header "PRIVATE-TOKEN: $gl_token" \
                "https://gitlab.com/api/v4/projects/$gl_id/repository/branches/$enc_name"
              echo "GitLab: удалена лишняя ветка $b"
            done
          fi

          # Codeberg и GitVerse
          prune_gitea_like () {
            label="$1"
            url="$2"
            token="$(token_of "$url")"
            [ -z "$token" ] && return 0
            project="$(repo_of "$url")"
            shift
            for base in "$@"; do
              branches="$(curl -s --header "Authorization: token $token" \
                "$base/repos/$project/branches" | jq -r '.[].name' 2>/dev/null | grep -v '^main$' || true)"
              [ -z "$branches" ] && continue
              for b in $branches; do
                enc_name="$(printf '%s' "$b" | enc)"
                curl -s -o /dev/null --request DELETE --header "Authorization: token $token" \
                  "$base/repos/$project/branches/$enc_name"
                echo "$label: удалена лишняя ветка $b"
              done
              return 0
            done
          }

          prune_gitea_like "Codeberg" "$CODEBERG_URL" "https://codeberg.org/api/v1"
          prune_gitea_like "GitVerse" "$GITVERSE_URL" "https://api.gitverse.ru/api/v1" "https://gitverse.ru/api/v1"
