name: Check subscription links

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links from docs/data.json
        id: check
        run: |
          set -e
          DEAD=""
          TOTAL=0
          URLS=$(jq -r '.subscriptions[].url' docs/data.json)
          while IFS= read -r url; do
            TOTAL=$((TOTAL+1))
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -L "$url" || echo "000")
            echo "$CODE  $url"
            if [ "$CODE" = "000" ] || [ "$CODE" = "404" ] || [ "$CODE" = "410" ] || [ "$CODE" = "500" ] || [ "$CODE" = "502" ] || [ "$CODE" = "503" ]; then
              DEAD="$DEAD$CODE $url\n"
            fi
          done <<< "$URLS"
          {
            echo "total=$TOTAL"
            echo "dead<<EOF"
            printf "$DEAD"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram (optional)
        if: ${{ secrets.TG_BOT_TOKEN != '' && secrets.TG_CHAT_ID != '' }}
        run: |
          MSG="StintikVPN link check (${{ steps.check.outputs.total }} subs):
          ${{ steps.check.outputs.dead }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d text="$MSG" || true

      - name: Create/update issue if dead links
        if: steps.check.outputs.dead != ''
        uses: actions/github-script@v7
        with:
          script: |
            const dead = `${{ steps.check.outputs.dead }}`.trim();
            const body = `Найдены мёртвые ссылки:\n\n\`\`\`\n${dead}\n\`\`\`\n\nИсточник: docs/data.json. Замените ссылки или найдите альтернативу.`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dead-link'
            });
            const existing = issues.data.find(i => i.title.includes('Dead subscription links'));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Dead subscription links found',
                body,
                labels: ['dead-link', 'auto']
              });
            }
